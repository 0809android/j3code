[package]
name = "j3-usage-scanner"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
memchr = "2.7"
rayon = "1.10"
ruzstd = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
