#cloud-config
# First-boot setup of a K3 relay machine: Ubuntu 24.04, x86_64, the OCI always-free micro
# (VM.Standard.E2.1.Micro, 1 GB). This file is a template: oci-provision.sh fills in the words
# written between double at-signs and refuses to go on if one is left. Nothing here runs by itself.
#
# What it sets up: Docker, a deploy user, a firewall (80 and 443 for everyone, 22 only from the
# CIDR you chose), 1 GB of swap, automatic security updates, the relay and Caddy through
# docker compose, and the nightly backup timer.

package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - git
  - jq
  - curl
  - unattended-upgrades
  - netfilter-persistent
  - iptables-persistent
  - python3-venv
  - python3-pip

# A 1 GB machine needs swap to survive a spike; the relay itself is limited to 400 MB.
swap:
  filename: /swapfile
  size: 1073741824
  maxsize: 1073741824

users:
  - default
  - name: k3
    gecos: K3 relay operator
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - "@@SSH_KEY@@"

write_files:
  - path: /etc/k3-relay/compose.env
    permissions: "0640"
    content: |
      RELAY_DOMAIN=@@RELAY_DOMAIN@@
      RELAY_IMAGE=@@RELAY_IMAGE@@

  - path: /etc/k3-relay/relay.env
    permissions: "0600"
    content: |
      # Read by the relay container. Empty values mean "off".
      K3_ALERT_WEBHOOK_URL=@@ALERT_WEBHOOK_URL@@
      K3_SELF_PING_URL=@@SELF_PING_URL@@
      K3_SELF_PING_INTERVAL_SEC=@@SELF_PING_INTERVAL_SEC@@

  - path: /etc/k3-relay/backup.env
    permissions: "0600"
    content: |
      BACKUP_BUCKET=@@BACKUP_BUCKET@@
      BACKUP_KEEP=14
      OCI_CLI_AUTH=instance_principal
      K3_ALERT_WEBHOOK_URL=@@ALERT_WEBHOOK_URL@@

  - path: /etc/sysctl.d/90-k3-relay.conf
    permissions: "0644"
    content: |
      vm.swappiness = 10

  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

  - path: /etc/apt/apt.conf.d/52k3-unattended-upgrades
    permissions: "0644"
    content: |
      // Security updates only (the Ubuntu default origins). A kernel update restarts the machine
      // at 19:00 UTC, which is 04:00 in Japan; the containers come back by themselves.
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "19:00";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";

  # The firewall. The OCI security list is the first layer, this is the second. Written after
  # the packages are installed, so it replaces the rules the image shipped with.
  - path: /etc/iptables/rules.v4
    permissions: "0644"
    defer: true
    content: |
      *filter
      :INPUT DROP [0:0]
      :FORWARD ACCEPT [0:0]
      :OUTPUT ACCEPT [0:0]
      -A INPUT -i lo -j ACCEPT
      -A INPUT -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
      -A INPUT -p icmp --icmp-type destination-unreachable -j ACCEPT
      -A INPUT -p icmp --icmp-type time-exceeded -j ACCEPT
      @@SSH_RULE_V4@@
      -A INPUT -p tcp --dport 80 -j ACCEPT
      -A INPUT -p tcp --dport 443 -j ACCEPT
      COMMIT

  - path: /etc/iptables/rules.v6
    permissions: "0644"
    defer: true
    content: |
      *filter
      :INPUT DROP [0:0]
      :FORWARD ACCEPT [0:0]
      :OUTPUT ACCEPT [0:0]
      -A INPUT -i lo -j ACCEPT
      -A INPUT -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
      -A INPUT -p ipv6-icmp -j ACCEPT
      -A INPUT -p tcp --dport 80 -j ACCEPT
      -A INPUT -p tcp --dport 443 -j ACCEPT
      COMMIT

  # Fetches the relay's deploy files at one pinned commit (only infra/k3-relay) and installs.
  - path: /usr/local/sbin/k3-relay-bootstrap
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      src=/opt/k3-relay/src
      repo_url='@@REPO_URL@@'
      repo_ref='@@REPO_REF@@'
      install -d /opt/k3-relay
      if [ ! -d "$src/.git" ]; then
        git init -q "$src"
        git -C "$src" remote add origin "$repo_url"
      fi
      git -C "$src" fetch --depth 1 --filter=blob:none origin "$repo_ref"
      git -C "$src" sparse-checkout set --cone infra/k3-relay
      git -C "$src" checkout -q --force FETCH_HEAD
      exec bash "$src/infra/k3-relay/deploy/install.sh"

runcmd:
  - sysctl --system
  # The firewall is loaded before Docker starts, so Docker's own rules are added on top of it.
  - netfilter-persistent reload
  - systemctl enable docker
  - systemctl restart docker
  - usermod -aG docker k3
  # The oci CLI, for the backup (it signs in as the instance, see the README).
  - python3 -m venv /opt/oci-cli
  - /opt/oci-cli/bin/pip install --quiet oci-cli
  - ln -sf /opt/oci-cli/bin/oci /usr/local/bin/oci
  - /usr/local/sbin/k3-relay-bootstrap
