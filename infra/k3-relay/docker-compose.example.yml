# A self-hosted K3 relay: Caddy (TLS) in front of the relay.
#
#   RELAY_DOMAIN=relay.example.com docker compose -f docker-compose.example.yml up -d --build
#
# Point a DNS A/AAAA record for RELAY_DOMAIN at this machine first, and open ports 80 and 443.
# Add REQUIRE_INVITE=1 below to make the relay private, then create codes with:
#   docker compose -f docker-compose.example.yml exec relay node src/cli.ts invite
services:
  relay:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    environment:
      TRUST_PROXY: "1"
      REQUIRE_INVITE: "0"
      # Sized for a 1 GB machine shared with Caddy. See README for what was measured.
      BUFFER_BUDGET_BYTES: "67108864"
      GLOBAL_BANDWIDTH_MBPS: "45"
      IMAGE_DIGEST: ${IMAGE_DIGEST:-unknown}
    volumes:
      - relay-data:/data
    expose:
      - "8080"
    mem_limit: 400m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - relay
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?set RELAY_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"

volumes:
  relay-data:
  caddy-data:
  caddy-config:
